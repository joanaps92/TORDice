<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Dice Room - Sala de Tiradas</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter & MedievalSharp for RPG feel -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card border-0 shadow-lg p-4 login-card animate-fade-in">
            <h1 class="text-center mb-4 logo-text">RPG DICE ROOM</h1>
            <div class="mb-3">
                <label for="username" class="form-label fw-bold text-muted">Tu Nombre de Héroe</label>
                <input type="text" class="form-control" id="username" placeholder="Ej. Gandalf el Gris">
            </div>
            <div class="mb-4">
                <label for="roomname" class="form-label fw-bold text-muted">Nombre de la Sala</label>
                <input type="text" class="form-control" id="roomname" placeholder="Ej. Mazmorra 1">
            </div>
            <button id="join-btn" class="btn btn-gold w-100 fw-bold py-2 mb-4">ENTRAR A LA AVENTURA</button>

            <!-- Room List Section -->
            <div id="room-list-container" class="mt-2 d-none">
                <h6 class="text-muted fw-bold mb-3 small uppercase tracking-wider">SALAS ACTIVAS</h6>
                <div id="room-list" class="list-group list-group-flush rounded shadow-sm overflow-hidden">
                    <!-- Rooms will be listed here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Screen (Hidden initially) -->
    <div id="app-screen" class="container-fluid py-4 d-none">
        <nav class="navbar navbar-light mb-4 px-3 rounded shadow-sm glass-panel">
            <span class="navbar-brand mb-0 h1 logo-text fs-3">RPG DICE ROOM</span>
            <div class="d-flex align-items-center">
                <span id="user-display" class="badge bg-gold text-dark me-3 fs-6"></span>
                <span id="room-display" class="badge bg-purple me-3 fs-6"></span>
                <button id="leave-btn" class="btn btn-outline-danger btn-sm ms-2">
                    <i class="fa-solid fa-right-from-bracket"></i> Salir
                </button>
            </div>
        </nav>

        <div class="row g-4">
            <!-- Controls Panel -->
            <div class="col-lg-4">
                <div class="card glass-panel h-100 border-0 p-4 shadow">
                    <h3 class="mb-4 section-title"><i class="fa-solid fa-dice-d20 me-2"></i>Preparar Tirada</h3>
                    
                    <div class="dice-input-group mb-4">
                        <label class="form-label d-flex justify-content-between">
                            <span><i class="fa-solid fa-dice-d20 me-1"></i> Dados D12</span>
                            <span id="d12-val" class="fw-bold text-gold">0</span>
                        </label>
                        <input type="range" class="form-range custom-range" id="d12-range" min="0" max="10" value="0">
                    </div>

                    <div class="dice-input-group mb-4">
                        <label class="form-label d-flex justify-content-between">
                            <span><i class="fa-solid fa-dice-six me-1"></i> Dados D6</span>
                            <span id="d6-val" class="fw-bold text-gold">0</span>
                        </label>
                        <input type="range" class="form-range custom-range" id="d6-range" min="0" max="10" value="0">
                    </div>

                    <button id="roll-btn" class="btn btn-gold btn-lg w-100 fw-bold mt-auto shadow-sm">
                        <i class="fa-solid fa-hand-fist me-2"></i>¡LANZAR DADOS!
                    </button>
                </div>

                <!-- Active Users Panel -->
                <div class="card glass-panel mt-4 border-0 p-4 shadow">
                    <h5 class="section-title mb-3"><i class="fa-solid fa-users me-2"></i>Aventureros</h5>
                    <div id="active-users-list" class="d-flex flex-wrap gap-2">
                        <!-- User badges will appear here -->
                    </div>
                </div>
            </div>

            <!-- History Panel -->
            <div class="col-lg-8">
                <div class="card glass-panel h-100 border-0 shadow overflow-hidden">
                    <div class="card-header bg-transparent border-0 p-4 pb-0 d-flex justify-content-between align-items-center">
                        <h3 class="section-title mb-0"><i class="fa-solid fa-scroll me-2"></i>Historial de la Sala</h3>
                        <div class="d-flex align-items-center gap-2">
                            <button id="clear-history-btn" class="btn btn-outline-danger btn-sm" title="Reiniciar Sala">
                                <i class="fa-solid fa-trash-can"></i> Reiniciar
                            </button>
                            <span class="text-muted small">Últimas 50</span>
                        </div>
                    </div>
                    <div id="history-list" class="card-body overflow-auto p-4" style="max-height: 70vh;">
                        <!-- Rolls will appear here -->
                        <div class="text-center text-muted mt-5 py-5 empty-msg">
                            <i class="fa-solid fa-ghost fa-3x mb-3 d-block"></i>
                            <p>No hay tiradas aún... ¡Sé el primero!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Socket.io client -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="client.js"></script>
</body>
</html>
